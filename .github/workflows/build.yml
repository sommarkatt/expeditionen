          package se.sommarkatt.coachpilot;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;
          import org.json.JSONTokener;

          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.time.Instant;
          import java.time.LocalDateTime;
          import java.time.OffsetDateTime;
          import java.time.ZoneOffset;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Läser och bockar av coachningar i Todoist. En coachning är en uppgift med etiketten coach. */
          final class Todoist {
              static final String LABEL = "coach";
              private static final String V1 = "https://api.todoist.com/api/v1/";
              private static final String V2 = "https://api.todoist.com/rest/v2/";
              private static final Pattern MINUTES =
                      Pattern.compile("(\\d{1,3})\\s*(?::?[ae])?\\s*min", Pattern.CASE_INSENSITIVE);

              static final class Task {
                  final String id;
                  final String name;
                  final String description;
                  final long since;

                  Task(String id, String name, String description, long since) {
                      this.id = id;
                      this.name = name;
                      this.description = description;
                      this.since = since;
                  }
              }

              static class HttpException extends IOException {
                  final int code;

                  HttpException(int code) {
                      super("HTTP " + code);
                      this.code = code;
                  }
              }

              static final class AuthException extends HttpException {
                  AuthException(int code) {
                      super(code);
                  }
              }

              private Todoist() {}

              static List<Task> coachTasks(String token) throws IOException {
                  String[] urls = {
                          V1 + "tasks?label=" + LABEL + "&limit=200",
                          V1 + "tasks/filter?query=%40" + LABEL + "&limit=200",
                          V2 + "tasks?label=" + LABEL,
                  };
                  HttpException last = null;
                  for (String url : urls) {
                      try {
                          return parse(request("GET", url, token));
                      } catch (AuthException e) {
                          throw e;
                      } catch (HttpException e) {
                          last = e;
                      }
                  }
                  throw last;
              }

              /** Bockar av uppgiften. En uppgift som redan är borta räknas som avbockad. */
              static void close(String token, String id) throws IOException {
                  String[] urls = {V1 + "tasks/" + id + "/close", V2 + "tasks/" + id + "/close"};
                  HttpException last = null;
                  for (String url : urls) {
                      try {
                          request("POST", url, token);
                          return;
                      } catch (AuthException e) {
                          throw e;
                      } catch (HttpException e) {
                          last = e;
                      }
                  }
                  if (last.code == 404 || last.code == 410) return;
                  throw last;
              }

              /** Intervallet i minuter, till exempel "var 20:e minut" i beskrivningen. Annars 20. */
              static int interval(String description, String name) {
                  int v = find(description);
                  if (v < 0) v = find(name);
                  if (v < 0) return 20;
                  return Math.max(5, Math.min(120, v));
              }

              private static int find(String s) {
                  if (s == null) return -1;
                  Matcher m = MINUTES.matcher(s);
                  if (!m.find()) return -1;
                  try {
                      return Integer.parseInt(m.group(1));
                  } catch (NumberFormatException e) {
                      return -1;
                  }
              }

              private static List<Task> parse(String body) throws IOException {
                  List<Task> out = new ArrayList<>();
                  try {
                      Object root = new JSONTokener(body).nextValue();
                      JSONArray arr = null;
                      if (root instanceof JSONArray) {
                          arr = (JSONArray) root;
                      } else if (root instanceof JSONObject) {
                          arr = ((JSONObject) root).optJSONArray("results");
                          if (arr == null) arr = ((JSONObject) root).optJSONArray("items");
                      }
                      if (arr == null) return out;
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject t = arr.optJSONObject(i);
                          if (t == null) continue;
                          if (t.optBoolean("checked") || t.optBoolean("is_completed") || t.optBoolean("is_deleted")) continue;
                          if (!hasLabel(t.optJSONArray("labels"))) continue;
                          String id = t.optString("id", "");
                          if (id.isEmpty()) continue;
                          String since = t.optString("updated_at", "");
                          if (since.isEmpty() || "null".equals(since)) since = t.optString("added_at", "");
                          if (since.isEmpty() || "null".equals(since)) since = t.optString("created_at", "");
                          out.add(new Task(id, t.optString("content", "").trim(), t.optString("description", ""), time(since)));
                      }
                  } catch (JSONException e) {
                      throw new IOException("Oväntat svar från Todoist", e);
                  }
                  return out;
              }

              private static boolean hasLabel(JSONArray labels) {
                  if (labels == null) return false;
                  for (int i = 0; i < labels.length(); i++) {
                      Object o = labels.opt(i);
                      String name = o instanceof JSONObject ? ((JSONObject) o).optString("name") : String.valueOf(o);
                      if (LABEL.equalsIgnoreCase(name.trim())) return true;
                  }
                  return false;
              }

              static long time(String s) {
                  if (s == null || s.isEmpty()) return 0L;
                  try {
                      return Instant.parse(s).toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return OffsetDateTime.parse(s).toInstant().toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  try {
                      return LocalDateTime.parse(s).toInstant(ZoneOffset.UTC).toEpochMilli();
                  } catch (Exception ignored) {
                  }
                  return 0L;
              }

              private static String request(String method, String url, String token) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  try {
                      c.setRequestMethod(method);
                      c.setConnectTimeout(8000);
                      c.setReadTimeout(8000);
                      c.setRequestProperty("Authorization", "Bearer " + token.trim());
                      c.setRequestProperty("Accept", "application/json");
                      if ("POST".equals(method)) {
                          c.setDoOutput(true);
                          c.setFixedLengthStreamingMode(0);
                          c.getOutputStream().close();
                      }
                      int code = c.getResponseCode();
                      String body = read(code >= 400 ? c.getErrorStream() : c.getInputStream());
                      if (code == 401 || code == 403) throw new AuthException(code);
                      if (code >= 400) throw new HttpException(code);
                      return body;
                  } finally {
                      c.disconnect();
                  }
              }

              private static String read(InputStream in) throws IOException {
                  if (in == null) return "";
                  ByteArrayOutputStream b = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) b.write(buf, 0, n);
                  in.close();
                  return b.toString("UTF-8");
              }
          }
