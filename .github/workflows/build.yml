          /** Färger, typografi och de två ritade elementen: kretskortet och samtalsknapparna. */
          final class Ui {
              static final int BLUE = 0xFF173A8C;
              static final int GROUND = 0xFFF4F5F7;
              static final int INK = 0xFF14161B;
              static final int MUTED = 0xFF6A707C;
              static final int LINE = 0xFFDADDE3;
              static final int GREEN = 0xFF2E9E62;
              static final int RED = 0xFFD8473A;

              private Ui() {}

              static int dp(Context c, float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          c.getResources().getDisplayMetrics()));
              }

              /** coachpilot i gemener, "ach" i en diskretare ton: på avstånd copilot, nära coach. */
              static CharSequence logo(int color, int dim) {
                  SpannableString s = new SpannableString("coachpilot");
                  s.setSpan(new ForegroundColorSpan(color), 0, 2, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  s.setSpan(new ForegroundColorSpan(dim), 2, 5, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  s.setSpan(new ForegroundColorSpan(color), 5, 10, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  return s;
              }

              static TextView text(Context c, CharSequence s, float sp, int color, boolean light) {
                  TextView t = new TextView(c);
                  t.setText(s);
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  t.setTextColor(color);
                  t.setTypeface(Typeface.create(light ? "sans-serif-light" : "sans-serif", Typeface.NORMAL));
                  return t;
              }

              static GradientDrawable box(int fill, int stroke, Context c) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(c, 2));
                  if (stroke != 0) g.setStroke(Math.max(1, dp(c, 1)), stroke);
                  return g;
              }

              /** 20:e, 21:a, 22:a, 30:e ... */
              static String ordinal(int n) {
                  int last = n % 10;
                  int lastTwo = n % 100;
                  boolean a = (last == 1 || last == 2) && lastTwo != 11 && lastTwo != 12;
                  return n + (a ? ":a" : ":e");
              }

              /** Stiliserat kretskort: få raka banor, en linjetjocklek, ett blått, mycket luft. */
              static final class CircuitView extends View {
                  // Hörn (0 uppe vänster, 1 uppe höger, 2 nere vänster, 3 nere höger),
                  // sedan punkter i rutor räknat inåt från hörnet. Sista punkten får en lödpunkt.
                  private static final float[][] TRACES = {
                          {1, 0f, 2.5f, 2f, 2.5f, 3.5f, 1f, 5.5f, 1f},
                          {0, 0f, 3.2f, 2f, 3.2f, 3f, 4.2f, 4.5f, 4.2f},
                          {2, 0f, 4.5f, 0.8f, 4.5f, 1.8f, 3.5f, 1.8f, 1.5f},
                          {3, 0f, 2f, 0.8f, 2f, 1.8f, 3f, 1.8f, 5f},
                  };
                  private final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Path path = new Path();

                  CircuitView(Context c) {
                      super(c);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(dp(c, 1.5f));
                      line.setStrokeJoin(Paint.Join.MITER);
                      line.setColor(0x38FFFFFF);
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      c.drawColor(BLUE);
                      float w = getWidth();
                      float h = getHeight();
                      float g = Math.min(w, h) / 12f;
                      float pad = dp(getContext(), 4.5f);
                      for (float[] t : TRACES) {
                          int corner = (int) t[0];
                          int n = (t.length - 1) / 2;
                          float[] xs = new float[n];
                          float[] ys = new float[n];
                          for (int i = 0; i < n; i++) {
                              float x = t[1 + i * 2] * g;
                              float y = t[2 + i * 2] * g;
                              xs[i] = (corner == 1 || corner == 3) ? w - x : x;
                              ys[i] = (corner == 2 || corner == 3) ? h - y : y;
                          }
                          float dx = xs[n - 1] - xs[n - 2];
                          float dy = ys[n - 1] - ys[n - 2];
                          float len = (float) Math.hypot(dx, dy);
                          path.reset();
                          path.moveTo(xs[0], ys[0]);
                          for (int i = 1; i < n - 1; i++) path.lineTo(xs[i], ys[i]);
                          path.lineTo(xs[n - 1] - dx / len * pad, ys[n - 1] - dy / len * pad);
                          c.drawPath(path, line);
                          c.drawCircle(xs[n - 1], ys[n - 1], pad, line);
                      }
                  }
              }

              /** Rund samtalsknapp med en ritad lur. Röd lur ligger ner. */
              static final class RoundButton extends View {
                  private final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint stroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final Paint dot = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private final RectF oval = new RectF();
                  private final boolean hangUp;

                  RoundButton(Context c, int color, boolean hangUp) {
                      super(c);
                      this.hangUp = hangUp;
                      fill.setColor(color);
                      stroke.setColor(Color.WHITE);
                      stroke.setStyle(Paint.Style.STROKE);
                      stroke.setStrokeCap(Paint.Cap.ROUND);
                      dot.setColor(Color.WHITE);
                      setClickable(true);
                      setFocusable(true);
                  }

                  @Override
                  protected void drawableStateChanged() {
                      super.drawableStateChanged();
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas c) {
                      float cx = getWidth() / 2f;
                      float cy = getHeight() / 2f;
                      float r = Math.min(cx, cy);
                      c.drawCircle(cx, cy, isPressed() ? r * 0.93f : r, fill);
                      c.save();
                      c.rotate(hangUp ? 135f : 0f, cx, cy);
                      float d = r * 0.16f;
                      float big = r * 0.44f;
                      float ox = cx + d;
                      float oy = cy - d;
                      oval.set(ox - big, oy - big, ox + big, oy + big);
                      stroke.setStrokeWidth(r * 0.13f);
                      c.drawArc(oval, 95f, 80f, false, stroke);
                      float end = r * 0.12f;
                      for (float deg : new float[]{95f, 175f}) {
                          double a = Math.toRadians(deg);
                          c.drawCircle(ox + (float) Math.cos(a) * big, oy + (float) Math.sin(a) * big, end, dot);
                      }
                      c.restore();
                  }
              }
          }
