      - name: Signeringsnyckel
        run: |
          if [ -f signing/coachpilot.jks.b64 ]; then
            base64 -d signing/coachpilot.jks.b64 > coachpilot.jks
          else
            keytool -genkeypair -keystore coachpilot.jks -storepass coachpilot -keypass coachpilot \
              -alias coachpilot -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Coachpilot"
            mkdir -p signing
            base64 -w0 coachpilot.jks > signing/coachpilot.jks.b64
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/coachpilot.jks.b64
            git commit -m "Signeringsnyckel för Coachpilot"
            git push
          fi

      - name: Bygg apk
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon --stacktrace

      - name: Publicera under Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk coachpilot.apk
          gh release create "v1.${{ github.run_number }}" coachpilot.apk \
            --title "Coachpilot 1.${{ github.run_number }}" \
            --notes "Ladda ner coachpilot.apk och installera." --latest
