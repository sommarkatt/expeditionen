# Coachpilot version 1 - hela appen i en fil.
# Spara filen i GitHub som .github/workflows/build.yml. Varje gång den sparas
# bygger GitHub apk-filen och lägger den under Releases som coachpilot.apk.

name: Bygg Coachpilot

on:
  push:
    branches: [main]
    paths-ignore:
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Skriv källkoden
        run: |
          mkdir -p \
            app \
            app/src/main \
            app/src/main/java/se/sommarkatt/coachpilot \
            app/src/main/res/drawable \
            app/src/main/res/mipmap-anydpi-v26 \
            app/src/main/res/values

          cat > settings.gradle <<'COACHPILOT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Coachpilot'
          include ':app'
          COACHPILOT_EOF

          cat > build.gradle <<'COACHPILOT_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          COACHPILOT_EOF

          cat > gradle.properties <<'COACHPILOT_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          COACHPILOT_EOF

          cat > app/build.gradle <<'COACHPILOT_EOF'
          plugins {
              id 'com.android.application'
          }

          def vc = Integer.parseInt((project.findProperty('vc') ?: '1').toString())

          android {
              namespace 'se.sommarkatt.coachpilot'
              compileSdk 34

              defaultConfig {
                  applicationId 'se.sommarkatt.coachpilot'
                  minSdk 26
                  targetSdk 34
                  versionCode vc
                  versionName "1.${vc}"
              }

              signingConfigs {
                  release {
                      storeFile rootProject.file('coachpilot.jks')
                      storePassword 'coachpilot'
                      keyAlias 'coachpilot'
                      keyPassword 'coachpilot'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }
          COACHPILOT_EOF

          cat > app/src/main/AndroidManifest.xml <<'COACHPILOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission
                  android:name="android.permission.SCHEDULE_EXACT_ALARM"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <queries>
                  <package android:name="com.anthropic.claude" />
                  <intent>
                      <action android:name="android.intent.action.ASSIST" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Coachpilot"
                  android:supportsRtl="true"
                  android:theme="@style/Setup">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".CallActivity"
                      android:excludeFromRecents="true"
                      android:exported="false"
                      android:launchMode="singleTask"
                      android:taskAffinity="se.sommarkatt.coachpilot.call"
                      android:theme="@style/Call" />

                  <receiver
                      android:name=".AlarmReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          COACHPILOT_EOF

          cat > app/src/main/java/se/sommarkatt/coachpilot/AlarmReceiver.java <<'COACHPILOT_EOF'
          package se.sommarkatt.coachpilot;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.PowerManager;

          /** Tar emot larmen (koll, samtal) och knapparna i notisen. */
          public class AlarmReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  final Context ctx = context.getApplicationContext();
                  final String action = intent.getAction() == null ? "" : intent.getAction();
                  final boolean test = intent.getBooleanExtra(Coach.EXTRA_TEST, false);
                  final PendingResult result = goAsync();
                  PowerManager pm = ctx.getSystemService(PowerManager.class);
                  final PowerManager.WakeLock lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "coachpilot:work");
                  lock.acquire(45_000L);
                  new Thread(() -> {
                      try {
                          switch (action) {
                              case Coach.POLL:
                                  Coach.syncSafe(ctx);
                                  break;
                              case Coach.RING:
                                  Coach.ring(ctx, test);
                                  break;
                              case Coach.DECLINE:
                                  Coach.stopRinging(ctx);
                                  break;
                              case Coach.DONE:
                                  Coach.done(ctx, test);
                                  break;
                              default:
                                  break;
                          }
                      } catch (Throwable ignored) {
                          // nästa koll tar vid
                      } finally {
                          if (Coach.POLL.equals(action)) {
                              try {
                                  Coach.schedulePoll(ctx, Coach.POLL_MS);
                              } catch (Throwable ignored) {
                                  // ställs igen när appen öppnas
                              }
                          }
                          if (lock.isHeld()) lock.release();
                          result.finish();
                      }
                  }).start();
              }
          }
          COACHPILOT_EOF

          cat > app/src/main/java/se/sommarkatt/coachpilot/BootReceiver.java <<'COACHPILOT_EOF'
          package se.sommarkatt.coachpilot;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          /** Ställer larmen igen efter omstart och uppdatering. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  Context ctx = context.getApplicationContext();
                  Store s = new Store(ctx);
                  Coach.schedulePoll(ctx, Coach.MINUTE);
                  if (!s.taskId().isEmpty()) {
                      long at = Math.max(s.nextRing(), System.currentTimeMillis() + Coach.MINUTE);
                      s.nextRing(at);
                      Coach.scheduleRing(ctx, at);
                  }
              }
          }
          COACHPILOT_EOF

          cat > app/src/main/java/se/sommarkatt/coachpilot/CallActivity.java <<'COACHPILOT_EOF'
          package se.sommarkatt.coachpilot;

          import android.app.Activity;
          import android.app.KeyguardManager;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          /** Det inkommande samtalet: helskärm, uppgiftens namn, rött och grönt. */
          public class CallActivity extends Activity {
              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Runnable timeout = this::finish;
              private final Runnable watch = new Runnable() {
                  @Override
                  public void run() {
                      if (!Coach.isRinging(CallActivity.this)) {
                          finish();
                          return;
                      }
                      handler.postDelayed(this, 1000L);
                  }
              };
              private boolean test;

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true);
                      setTurnScreenOn(true);
                  } else {
                      getWindow().addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED
                              | WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON);
                  }
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  handle(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handle(intent);
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }

              @Override
              public void onBackPressed() {
                  decline();
              }

              private void handle(Intent intent) {
                  handler.removeCallbacksAndMessages(null);
                  test = intent.getBooleanExtra(Coach.EXTRA_TEST, false);
                  if (intent.getBooleanExtra(Coach.EXTRA_ANSWER, false)) {
                      setContentView(new Ui.CircuitView(this));
                      answer();
                      return;
                  }
                  String name = intent.getStringExtra(Coach.EXTRA_NAME);
                  setContentView(build(name == null ? "" : name));
                  handler.postDelayed(timeout, Coach.RING_MS + 2000L);
                  handler.postDelayed(watch, 1500L);
              }

              private void decline() {
                  Coach.stopRinging(this);
                  finish();
              }

              private void done() {
                  Coach.stopRinging(this);
                  sendBroadcast(new Intent(this, AlarmReceiver.class)
                          .setAction(Coach.DONE)
                          .putExtra(Coach.EXTRA_TEST, test));
                  Toast.makeText(this, test ? "Provsamtalet är avslutat." : "Klart. Coachningen är avslutad.",
                          Toast.LENGTH_SHORT).show();
                  finish();
              }

              private void answer() {
                  Coach.stopRinging(this);
                  handler.removeCallbacksAndMessages(null);
                  KeyguardManager km = getSystemService(KeyguardManager.class);
                  if (km != null && km.isKeyguardLocked()) {
                      km.requestDismissKeyguard(this, new KeyguardManager.KeyguardDismissCallback() {
                          @Override
                          public void onDismissSucceeded() {
                              openClaude();
                          }

                          @Override
                          public void onDismissCancelled() {
                              finish();
                          }

                          @Override
                          public void onDismissError() {
                              openClaude();
                          }
                      });
                  } else {
                      openClaude();
                  }
              }

              private void openClaude() {
                  if (!Coach.openClaude(this)) {
                      Toast.makeText(this, "Hittade inte Claude på den här enheten.", Toast.LENGTH_LONG).show();
                  }
                  finish();
              }

              private View build(String name) {
                  FrameLayout root = new FrameLayout(this);
                  root.addView(new Ui.CircuitView(this), new FrameLayout.LayoutParams(MATCH, MATCH));

                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  int side = Ui.dp(this, 36);
                  col.setPadding(side, Ui.dp(this, 32), side, Ui.dp(this, 44));
                  int width = Math.min(getResources().getDisplayMetrics().widthPixels, Ui.dp(this, 620));
                  root.addView(col, new FrameLayout.LayoutParams(width, MATCH, Gravity.CENTER_HORIZONTAL));

                  col.addView(Ui.text(this, Ui.logo(Color.WHITE, 0x66FFFFFF), 20, Color.WHITE, false));
                  col.addView(new View(this), new LinearLayout.LayoutParams(MATCH, 0, 1f));

                  col.addView(Ui.text(this, "Hur går det?", 22, 0xBFFFFFFF, true));

                  TextView title = Ui.text(this, name, 44, Color.WHITE, true);
                  title.setMaxLines(4);
                  title.setEllipsize(TextUtils.TruncateAt.END);
                  title.setLineSpacing(0f, 1.05f);
                  LinearLayout.LayoutParams tlp = new LinearLayout.LayoutParams(MATCH, WRAP);
                  tlp.topMargin = Ui.dp(this, 10);
                  col.addView(title, tlp);

                  col.addView(new View(this), new LinearLayout.LayoutParams(MATCH, 0, 1.3f));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_HORIZONTAL);
                  row.addView(callButton(Ui.RED, true, "Mitt i det", v -> decline()));
                  row.addView(new View(this), new LinearLayout.LayoutParams(Ui.dp(this, 96), 1));
                  row.addView(callButton(Ui.GREEN, false, "Svara", v -> answer()));
                  col.addView(row, new LinearLayout.LayoutParams(MATCH, WRAP));

                  TextView klar = Ui.text(this, "Klar", 16, Color.WHITE, false);
                  klar.setGravity(Gravity.CENTER);
                  klar.setPadding(Ui.dp(this, 32), Ui.dp(this, 11), Ui.dp(this, 32), Ui.dp(this, 11));
                  GradientDrawable pill = new GradientDrawable();
                  pill.setCornerRadius(Ui.dp(this, 24));
                  pill.setStroke(Math.max(1, Ui.dp(this, 1)), 0x80FFFFFF);
                  klar.setBackground(pill);
                  klar.setOnClickListener(v -> done());
                  LinearLayout.LayoutParams klp = new LinearLayout.LayoutParams(WRAP, WRAP);
                  klp.gravity = Gravity.CENTER_HORIZONTAL;
                  klp.topMargin = Ui.dp(this, 40);
                  col.addView(klar, klp);

                  TextView hint = Ui.text(this,
                          test ? "Provsamtal. Inget bockas av." : "Klar bockar av uppgiften i Todoist.",
                          12, 0x8CFFFFFF, false);
                  hint.setGravity(Gravity.CENTER);
                  LinearLayout.LayoutParams hlp = new LinearLayout.LayoutParams(MATCH, WRAP);
                  hlp.topMargin = Ui.dp(this, 10);
                  col.addView(hint, hlp);
                  return root;
              }

              private View callButton(int color, boolean hangUp, String label, View.OnClickListener l) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER_HORIZONTAL);
                  Ui.RoundButton b = new Ui.RoundButton(this, color, hangUp);
                  b.setContentDescription(label);
                  b.setOnClickListener(l);
                  int size = Ui.dp(this, 76);
                  box.addView(b, new LinearLayout.LayoutParams(size, size));
                  TextView t = Ui.text(this, label, 14, 0xCCFFFFFF, false);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(WRAP, WRAP);
                  lp.topMargin = Ui.dp(this, 10);
                  lp.gravity = Gravity.CENTER_HORIZONTAL;
                  box.addView(t, lp);
                  return box;
              }
          }
          COACHPILOT_EOF

          cat > app/src/main/java/se/sommarkatt/coachpilot/Coach.java <<'COACHPILOT_EOF'
          package se.sommarkatt.coachpilot;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ActivityNotFoundException;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import android.service.notification.StatusBarNotification;

          import java.io.IOException;
          import java.util.List;

          /** Coachningens logik: läsa Todoist, ställa larm, ringa. */
          final class Coach {
              static final String CHANNEL = "samtal";
              static final int NOTIFICATION = 7;
              static final long MINUTE = 60_000L;
              static final long RING_MS = 60_000L;
              static final long POLL_MS = 10 * MINUTE;
              static final String CLAUDE = "com.anthropic.claude";

              static final String POLL = "se.sommarkatt.coachpilot.POLL";
              static final String RING = "se.sommarkatt.coachpilot.RING";
              static final String DECLINE = "se.sommarkatt.coachpilot.DECLINE";
              static final String DONE = "se.sommarkatt.coachpilot.DONE";

              static final String EXTRA_TEST = "test";
              static final String EXTRA_NAME = "name";
              static final String EXTRA_ANSWER = "answer";

              private static final int FLAGS = PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE;

              private Coach() {}

              /** Läser coachningarna i Todoist och ställer nästa samtal. */
              static synchronized void sync(Context ctx) throws IOException {
                  Store s = new Store(ctx);
                  String token = s.token();
                  if (token.isEmpty()) return;
                  List<Todoist.Task> tasks = Todoist.coachTasks(token);
                  long now = System.currentTimeMillis();
                  s.lastSync(now);

                  String doneId = s.doneId();
                  boolean doneSeen = false;
                  Todoist.Task chosen = null;
                  for (Todoist.Task t : tasks) {
                      if (t.id.equals(doneId)) {
                          doneSeen = true;
                          continue;
                      }
                      if (chosen == null || t.since > chosen.since) chosen = t;
                  }
                  if (!doneId.isEmpty()) {
                      if (!doneSeen) {
                          s.doneId("");
                      } else {
                          try {
                              Todoist.close(token, doneId);
                              s.doneId("");
                          } catch (IOException ignored) {
                              // nytt försök vid nästa koll
                          }
                      }
                  }

                  if (chosen == null) {
                      if (!s.taskId().isEmpty()) {
                          s.clearTask();
                          cancelRing(ctx);
                      }
                      return;
                  }

                  int interval = Todoist.interval(chosen.description, chosen.name);
                  long next;
                  if (!chosen.id.equals(s.taskId())) {
                      long start = chosen.since > 0 && chosen.since <= now ? chosen.since : now;
                      next = Math.max(start + interval * MINUTE, now + 30_000L);
                  } else {
                      next = s.nextRing();
                      if (next < now) next = now + 30_000L;
                  }
                  s.task(chosen.id, chosen.name, interval);
                  s.nextRing(next);
                  scheduleRing(ctx, next);
              }

              static boolean syncSafe(Context ctx) {
                  Store s = new Store(ctx);
                  if (s.token().isEmpty()) return false;
                  try {
                      sync(ctx);
                      s.note("");
                      return true;
                  } catch (Todoist.AuthException e) {
                      s.note("Todoist godkänner inte nyckeln.");
                  } catch (IOException e) {
                      s.note("Kunde inte nå Todoist vid senaste kollen.");
                  }
                  return false;
              }

              static void ring(Context ctx, boolean test) {
                  if (test) {
                      showCall(ctx, "Provsamtal", true);
                      return;
                  }
                  Store s = new Store(ctx);
                  if (s.token().isEmpty()) return;
                  String before = s.taskId();
                  syncSafe(ctx);
                  String id = s.taskId();
                  if (id.isEmpty() || !id.equals(before)) return;
                  long next = System.currentTimeMillis() + s.interval() * MINUTE;
                  s.nextRing(next);
                  scheduleRing(ctx, next);
                  if (s.ringHere()) showCall(ctx, s.taskName(), false);
              }

              static synchronized void done(Context ctx, boolean test) {
                  stopRinging(ctx);
                  if (test) return;
                  Store s = new Store(ctx);
                  String id = s.taskId();
                  if (id.isEmpty()) return;
                  s.doneId(id);
                  s.clearTask();
                  cancelRing(ctx);
                  try {
                      Todoist.close(s.token(), id);
                      s.doneId("");
                  } catch (IOException e) {
                      s.note("Kunde inte bocka av i Todoist. Försöker igen vid nästa koll.");
                  }
              }

              static void ensureChannel(Context ctx) {
                  NotificationManager nm = ctx.getSystemService(NotificationManager.class);
                  if (nm.getNotificationChannel(CHANNEL) != null) return;
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "Samtal", NotificationManager.IMPORTANCE_HIGH);
                  ch.setDescription("Coachpilot ringer medan en coachning pågår.");
                  Uri sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE);
                  if (sound == null) sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM);
                  AudioAttributes audio = new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_ALARM)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build();
                  ch.setSound(sound, audio);
                  ch.enableVibration(true);
                  ch.setVibrationPattern(new long[]{0, 800, 600, 800, 600, 800, 1600});
                  ch.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                  ch.setBypassDnd(true);
                  nm.createNotificationChannel(ch);
              }

              static void showCall(Context ctx, String name, boolean test) {
                  ensureChannel(ctx);
                  NotificationManager nm = ctx.getSystemService(NotificationManager.class);
                  Intent call = new Intent(ctx, CallActivity.class)
                          .putExtra(EXTRA_NAME, name)
                          .putExtra(EXTRA_TEST, test)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_NO_USER_ACTION);
                  PendingIntent callPi = PendingIntent.getActivity(ctx, 10, call, FLAGS);
                  Intent answer = new Intent(call).putExtra(EXTRA_ANSWER, true);
                  PendingIntent answerPi = PendingIntent.getActivity(ctx, 11, answer, FLAGS);
                  PendingIntent declinePi = PendingIntent.getBroadcast(ctx, 12,
                          new Intent(ctx, AlarmReceiver.class).setAction(DECLINE), FLAGS);

                  Notification n = new Notification.Builder(ctx, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle(name)
                          .setContentText("Hur går det?")
                          .setCategory(Notification.CATEGORY_ALARM)
                          .setVisibility(Notification.VISIBILITY_PUBLIC)
                          .setColor(Ui.BLUE)
                          .setOngoing(true)
                          .setAutoCancel(false)
                          .setShowWhen(true)
                          .setWhen(System.currentTimeMillis())
                          .setTimeoutAfter(RING_MS)
                          .setContentIntent(callPi)
                          .setFullScreenIntent(callPi, true)
                          .addAction(new Notification.Action.Builder((Icon) null, "Mitt i det", declinePi).build())
                          .addAction(new Notification.Action.Builder((Icon) null, "Svara", answerPi).build())
                          .build();
                  n.flags |= Notification.FLAG_INSISTENT;
                  nm.notify(NOTIFICATION, n);
              }

              static void stopRinging(Context ctx) {
                  ctx.getSystemService(NotificationManager.class).cancel(NOTIFICATION);
              }

              static boolean isRinging(Context ctx) {
                  NotificationManager nm = ctx.getSystemService(NotificationManager.class);
                  for (StatusBarNotification n : nm.getActiveNotifications()) {
                      if (n.getId() == NOTIFICATION) return true;
                  }
                  return false;
              }

              /** Grönt: öppna Claude, helst som assistent med röstläget. */
              static boolean openClaude(Context ctx) {
                  Intent launch = ctx.getPackageManager().getLaunchIntentForPackage(CLAUDE);
                  Intent[] tries = {
                          new Intent(Intent.ACTION_ASSIST).setPackage(CLAUDE),
                          new Intent("android.intent.action.VOICE_ASSIST").setPackage(CLAUDE),
                          new Intent(Intent.ACTION_VOICE_COMMAND).setPackage(CLAUDE),
                          launch,
                          new Intent(Intent.ACTION_ASSIST),
                  };
                  for (Intent i : tries) {
                      if (i == null) continue;
                      try {
                          ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK));
                          return true;
                      } catch (ActivityNotFoundException | SecurityException ignored) {
                          // prova nästa väg
                      }
                  }
                  return false;
              }

              static void schedulePoll(Context ctx, long delay) {
                  setAlarm(ctx, System.currentTimeMillis() + delay, broadcast(ctx, POLL, 2, false));
              }

              static void scheduleRing(Context ctx, long at) {
                  setAlarm(ctx, at, broadcast(ctx, RING, 1, false));
              }

              static void scheduleTest(Context ctx, long delay) {
                  setAlarm(ctx, System.currentTimeMillis() + delay, broadcast(ctx, RING, 3, true));
              }

              static void cancelRing(Context ctx) {
                  ctx.getSystemService(AlarmManager.class).cancel(broadcast(ctx, RING, 1, false));
              }

              private static PendingIntent broadcast(Context ctx, String action, int code, boolean test) {
                  Intent i = new Intent(ctx, AlarmReceiver.class).setAction(action);
                  if (test) i.putExtra(EXTRA_TEST, true);
                  return PendingIntent.getBroadcast(ctx, code, i, FLAGS);
              }

              private static void setAlarm(Context ctx, long at, PendingIntent pi) {
                  AlarmManager am = ctx.getSystemService(AlarmManager.class);
                  try {
                      if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      } else {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                      }
                  } catch (SecurityException e) {
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                  }
              }
          }
