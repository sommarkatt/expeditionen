          package se.sommarkatt.coachpilot;

          import android.content.Context;
          import android.content.SharedPreferences;

          /** Allt Coachpilot minns mellan samtalen. */
          final class Store {
              private final SharedPreferences p;

              Store(Context c) {
                  p = c.getApplicationContext().getSharedPreferences("coachpilot", Context.MODE_PRIVATE);
              }

              String token() { return p.getString("token", ""); }
              void token(String v) { p.edit().putString("token", v).commit(); }

              boolean ringHere() { return p.getBoolean("ringHere", true); }
              void ringHere(boolean v) { p.edit().putBoolean("ringHere", v).commit(); }

              String taskId() { return p.getString("taskId", ""); }
              String taskName() { return p.getString("taskName", ""); }
              int interval() { return p.getInt("interval", 20); }

              void task(String id, String name, int interval) {
                  p.edit().putString("taskId", id).putString("taskName", name).putInt("interval", interval).commit();
              }

              void clearTask() {
                  p.edit().remove("taskId").remove("taskName").remove("nextRing").commit();
              }

              long nextRing() { return p.getLong("nextRing", 0L); }
              void nextRing(long t) { p.edit().putLong("nextRing", t).commit(); }

              String doneId() { return p.getString("doneId", ""); }
              void doneId(String v) { p.edit().putString("doneId", v).commit(); }

              String note() { return p.getString("note", ""); }
              void note(String v) { p.edit().putString("note", v).commit(); }

              long lastSync() { return p.getLong("lastSync", 0L); }
              void lastSync(long t) { p.edit().putLong("lastSync", t).commit(); }
          }
